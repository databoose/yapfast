[package]
name = "talk-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
anyhow.workspace = true
directories.workspace = true
futures-util.workspace = true
# Decode received images with bounded dimensions before the UI sees them.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
keyring.workspace = true
livekit.workspace = true
matrix-sdk.workspace = true
matrix-sdk-ui.workspace = true
matrix-sdk-crypto.workspace = true
matrix-rtc-livekit.workspace = true
matrix-rtc-core.workspace = true
matrix-rtc-media.workspace = true
mime = "0.3"
# Plain-text reply snippets from Markdown; the SDK already uses it to format messages.
pulldown-cmark = { version = "0.13", default-features = false }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true
