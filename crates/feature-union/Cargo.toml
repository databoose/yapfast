[package]
name = "feature-union"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "No code: scripts/check selects it with each network alone, so Slint and the UI crate resolve as in the full build and compile once"

[lib]
doctest = false
test = false

# The features the full workspace build enables on crates below Slint, which
# Discord or Matrix alone would leave off. Each enabled here already is in the
# full build, so selecting this crate there changes nothing. When the network
# steps of scripts/check compile yapfast-ui again, a crate here has drifted.
[dependencies]
arrayvec = { version = "0.7", features = ["serde"] }
bitflags = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
getrandom = { version = "0.4", features = ["std", "sys_rng"] }
idna = "1"
indexmap = { version = "2", features = ["serde"] }
itertools = "0.13"
phf_shared = "0.13"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["alloc", "derive", "rc"] }
serde_core = "1"
smallvec = { version = "1", features = ["const_generics", "const_new"] }
thiserror = "2"
url = { version = "2", features = ["serde"] }
zerocopy = { version = "0.8", features = ["derive", "simd"] }

# The same for build scripts and procedural macros, which Cargo resolves apart.
[build-dependencies]
itertools = "0.13"
phf_shared = "0.13"
thiserror = "2"
