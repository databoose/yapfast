[package]
name = "yapfast-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "Yapfast's compiled Slint interface, kept apart so Rust changes elsewhere do not recompile it"

[lib]
# No documentation examples run as tests: rustdoc would read the whole
# crate on every `cargo test` for none.
doctest = false

[dependencies]
slint.workspace = true

[build-dependencies]
slint-build = "=1.18.1"
