# From element-hq/matrix-rust-rtc@5831af899f1e1744c21332613cdc9578a98c604f.
# Workspace/path dependencies are expanded to their original pinned sources.
[package]
name = "matrix-rtc-livekit"
version = "0.4.0-rc.1"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Element-Commercial"
publish = false

[dependencies]
matrix-rtc-core = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "5831af899f1e1744c21332613cdc9578a98c604f" }
matrix-rtc-bridge = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "5831af899f1e1744c21332613cdc9578a98c604f" }
matrix-rtc-livekit-proto = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "5831af899f1e1744c21332613cdc9578a98c604f" }
matrix-rtc-media = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "5831af899f1e1744c21332613cdc9578a98c604f" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
log = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
livekit = { version = "0.7", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", optional = true, features = ["experimental-send-custom-to-device"] }
matrix-sdk-ui = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
matrix-sdk = ["matrix-rtc-bridge/matrix-sdk", "dep:matrix-sdk", "dep:matrix-sdk-ui", "matrix-sdk-ui/unstable-msc4354"]
testing = ["matrix-sdk?/testing"]
